[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "_aiops_rust"
manifest-path = "rust/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "unit: Testes unitários (sem deps externas, sem ML, sem API)",
    "integration: Testes de integração (pipeline completo, modo --no-llm)",
    "snapshot: Testes de snapshot (validação de output determinístico)",
    "slow: Testes lentos de performance (podem demorar >10s)",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::FutureWarning:torch.*",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["rust/target"]

[tool.ruff.lint]
# Conjunto explícito e estável (o padrão do ruff muda entre versões):
# erros de sintaxe/runtime (E4, E7, E9), pyflakes (F) e try/except/pass (S110).
select = ["E4", "E7", "E9", "F", "S110"]
# Imports depois de ajuste de sys.path/pytest_plugins são intencionais.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Pacotes reexportam nomes nos __init__.
"**/__init__.py" = ["F401"]
