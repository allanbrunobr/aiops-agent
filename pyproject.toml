[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "_aiops_rust"
manifest-path = "rust/Cargo.toml"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E402: entrypoints carregam .env.local/sys.path ANTES dos imports de propósito
# (ex.: infra/run_webhook_server.py) e testes usam importorskip antes de imports.
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Módulos puros (domain/application/core) são type-checados; o resto é
# permissivo por enquanto (expansão gradual conforme o plano de melhorias).
[[tool.mypy.overrides]]
module = "*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "domain", "domain.*",
    "application", "application.*",
    "core", "core.*",
]
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "unit: Testes unitários (sem deps externas, sem ML, sem API)",
    "integration: Testes de integração (pipeline completo, modo --no-llm)",
    "snapshot: Testes de snapshot (validação de output determinístico)",
    "slow: Testes lentos de performance (podem demorar >10s)",
    "e2e: Testes end-to-end Playwright do demo (browser headless; requer chromium + CDN)",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::FutureWarning:torch.*",
]
