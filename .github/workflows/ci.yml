# CI Pipeline for AIOps Agent
# Runs all tests on push to main and on pull requests.
# Two parallel jobs: unit-tests (minimal deps) and integration-tests (full deps).
# No API keys or ML model downloads required (FR36, NFR22).

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (stdlib-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: pip install 'pytest>=9.0.0' 'pytest-mock>=3.14.0' 'anyio>=4.0.0'

      - name: Run unit tests
        run: pytest tests/ -m unit -v

  integration-tests:
    name: Integration & Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install full dependencies
        run: pip install -r requirements.txt

      - name: Run integration and snapshot tests
        run: pytest tests/ -m "integration or snapshot" -v

  rust-build:
    name: Rust Build & PyO3 Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build PyO3 extension (release — performance benchmarks require optimized build)
        run: maturin develop --manifest-path rust/Cargo.toml --release

      - name: Verify import
        run: python -c "import _aiops_rust; print(dir(_aiops_rust))"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Run evaluator
        run: python evaluate.py
