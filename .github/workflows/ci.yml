# CI Pipeline for AIOps Agent
# Runs all tests on push to main and on pull requests.
# Two parallel jobs: unit-tests (minimal deps) and integration-tests (full deps).
# No API keys or ML model downloads required (FR36, NFR22).

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (stdlib-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: |
          pip install \
            'pytest>=9.0.0' \
            'pytest-mock>=3.14.0' \
            'pytest-asyncio>=0.24.0' \
            'anyio[trio]>=4.0.0' \
            'pydantic>=2.0.0' \
            'pydantic-settings[yaml]>=2.0.0' \
            'PyYAML>=6.0.0' \
            'structlog>=24.1.0' \
            'fastapi>=0.115.0' \
            'httpx>=0.27.0' \
            'PyJWT>=2.8.0' \
            'cryptography>=42.0' \
            'python-dotenv>=1.0.0' \
            'rich>=13.0.0' \
            'numpy<2.0.0' \
            'drain3>=0.9.11' \
            'anthropic>=0.40.0' \
            'databricks-sdk>=0.38.0' \
            'requests>=2.28.0' \
            'slack-sdk>=3.27.0' \
            'aiohttp>=3.9.0' \
            'mcp>=1.0.0,<2.0.0'

      - name: Run unit tests
        run: pytest tests/ -m unit --ignore=tests/rust -v

  integration-tests:
    name: Integration & Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install full dependencies
        run: pip install -r requirements.txt

      - name: Run integration and snapshot tests
        run: pytest tests/ -m "integration or snapshot" -v

  rust-build:
    name: Rust Build & PyO3 Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build PyO3 extension (release — performance benchmarks require optimized build)
        run: |
          maturin build --manifest-path rust/Cargo.toml --release
          pip install rust/target/wheels/*.whl

      - name: Verify import
        run: python -c "import _aiops_rust; print(dir(_aiops_rust))"

      - name: Run pytest
        run: python -m pytest tests/ -v
