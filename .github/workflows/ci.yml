# CI Pipeline for AIOps Agent
# Runs all tests on push to main and on pull requests.
# Five parallel jobs: lint (ruff + mypy), unit-tests (minimal deps),
# integration-tests (full deps), real-rag (real ML models, HF cache) and
# rust-build (cargo + PyO3).
# No API keys required (FR36, NFR22). HF model downloads happen only in the
# real-rag job (tests marked real_rag are excluded from the other jobs).

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: pip install 'ruff==0.17.5' 'mypy>=2.4.1'

      # Regras em pyproject.toml [tool.ruff]; job separado para não pular testes.
      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (gate estendido)
        run: mypy domain application core pipeline safety data agents tools rag auth interfaces/http

  unit-tests:
    name: Unit Tests (stdlib-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install minimal dependencies
        run: |
          pip install \
            'pytest>=9.0.0' \
            'pytest-mock>=3.14.0' \
            'pytest-asyncio>=0.24.0' \
            'anyio[trio]>=4.0.0' \
            'pydantic>=2.0.0' \
            'pydantic-settings[yaml]>=2.0.0' \
            'PyYAML>=6.0.0' \
            'structlog>=24.1.0' \
            'fastapi>=0.115.0' \
            'httpx>=0.27.0' \
            'PyJWT>=2.8.0' \
            'cryptography>=42.0' \
            'python-dotenv>=1.0.0' \
            'rich>=13.0.0' \
            'numpy<2.0.0' \
            'drain3>=0.9.11' \
            'anthropic>=0.40.0' \
            'databricks-sdk>=0.38.0' \
            'requests>=2.28.0' \
            'slack-sdk>=3.27.0' \
            'aiohttp>=3.9.0' \
            'mcp>=1.0.0,<2.0.0' \
            'pytest-cov>=7.1.0'

      - name: Run unit tests (coverage report, no threshold gate)
        run: pytest tests/ -m unit --ignore=tests/rust -v --cov --cov-report=term-missing --cov-report=xml:coverage.xml

  integration-tests:
    name: Integration & Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install full dependencies
        run: pip install -r requirements.txt

      - name: Run integration and snapshot tests
        run: pytest tests/ -m "(integration or snapshot) and not real_rag" -v

  # Closes the num_workers blind spot: unit/integration mock the model and
  # swallow invalid kwargs; here encode/rerank run with real models.
  real-rag:
    name: Real RAG (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install full dependencies
        run: pip install -r requirements.txt

      # all-MiniLM-L6-v2 (~90MB) + cross-encoder/qnli-distilroberta-base (~250MB)
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}-v1

      - name: Run real-RAG tests
        run: pytest tests/ -m real_rag -v

  rust-build:
    name: Rust Build & PyO3 Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Rust lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build PyO3 extension (release — performance benchmarks require optimized build)
        run: |
          maturin build --manifest-path rust/Cargo.toml --release
          pip install rust/target/wheels/*.whl

      - name: Verify import
        run: python -c "import _aiops_rust; print(dir(_aiops_rust))"

      - name: Run pytest
        run: python -m pytest tests/ -m "not real_rag" -v
