# CI Pipeline for AIOps Agent
# Runs all tests on push to main and on pull requests.
# Two parallel jobs: unit-tests (minimal deps) and integration-tests (full deps).
# No API keys or ML model downloads required (FR36, NFR22).

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (stdlib-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test-unit.txt

      - name: Install minimal dependencies
        run: pip install -r requirements-test-unit.txt

      - name: Run unit tests
        run: pytest tests/ -m unit -v

  integration-tests:
    name: Integration & Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install full dependencies
        run: pip install -r requirements.txt

      - name: Run integration and snapshot tests
        run: pytest tests/ -m "integration or snapshot" -v
