# AIOps Agent — Configuração padrão
# Overrides via variáveis de ambiente: AIOPS_SECAO__CAMPO=valor
# O prefixo do Pydantic é AIOPS_ (um underscore) e o delimitador aninhado é __.
# Ex: AIOPS_THRESHOLDS__SIGMA_THRESHOLD=4.0
# Ex: AIOPS_MCP__OAUTH__JWT_SECRET=... (32 bytes ou mais)

# Thresholds de análise de anomalias
thresholds:
  sigma_threshold: 3.0           # Desvios padrão acima da baseline para anomalia
  baseline_ratio: 0.5            # Fração da série temporal usada como baseline
  percentile_threshold: 95.0     # Percentil acima do qual traces são "lentos"
  max_hops: 3                    # Profundidade máxima do call path
  regression_threshold: -5.0     # Delta mínimo de health aceitável (STRATUS paper)
  error_threshold: 50            # Número mínimo de erros para acionar incidente
  detection_sigma_threshold: 3.0 # Sigma threshold para classificação de severidade

# Configuração de segurança
safety:
  blast_radius_limit: 5          # Máximo de serviços afetados sem aprovação humana
  require_human_approval: true   # Sempre requer aprovação humana para ações

# Blueprint Engine
blueprint:
  enabled: true

# Servidor webhook (stub — habilitado no épico 2)
webhook:
  host: "127.0.0.1"
  port: 47890

# Notificações Slack (stub — habilitado no épico 3)
slack:
  enabled: false
  webhook_url: ""

# MCP Toolshed — servidor de ferramentas para agentes externos
mcp:
  enabled: false                    # Desabilitado por padrão — opt-in explícito
  transport: sse                    # "stdio" (dev local) ou "sse" (produção/remoto)
  sse_port: 3001                    # Porta SSE (ignorada no modo stdio)
  enabled_tools:                    # Ferramentas habilitadas (subconjunto de 3 disponíveis)
    - diagnose_incident
    - validate_action
    - search_incidents
  auth_method: header               # "header" (X-Client-Id), "oauth21" (Bearer JWT) ou "none"
  oauth:
    jwt_secret: ""                  # via env: AIOPS_MCP__OAUTH__JWT_SECRET (mínimo 32 bytes)
    token_ttl: 3600
    # Cada cliente precisa de `secret_sha256` (SHA-256 hex do client_secret)
    # para receber token em /auth/token/register (client_secret_post).
    # Sem ele o cliente é recusado: o client_id abaixo é público, não credencial.
    # Gerar o hash sem gravar o segredo em disco:
    #   python -c "import hashlib,getpass; print(hashlib.sha256(getpass.getpass().encode()).hexdigest())"
    allowed_clients:
      - id: assistant-agent
        scopes: [aiops:diagnose, aiops:search]
      - id: databricks-mcp
        scopes: [aiops:search]
      - id: sre-orchestrator
        scopes: [aiops:diagnose, aiops:search, aiops:validate]
  rate_limits:
    diagnose: 10                    # diagnose_incident: 10 chamadas/min (caro: LLM + FAISS + safety)
    search: 60                      # search_incidents: 60 chamadas/min (barato: RAG read-only)
    validate: 30                    # validate_action: 30 chamadas/min (moderado: safety layers)
