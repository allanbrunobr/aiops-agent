# Grafana Contact Points — sends webhooks to the local aiops-agent
apiVersion: 1

contactPoints:
  - orgId: 1
    name: aiops-webhook
    receivers:
      - uid: aiops-webhook-receiver
        type: webhook
        settings:
          url: "http://host.docker.internal:47890/webhook"
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: "test-grafana-token-local"
        disableResolveMessage: false
